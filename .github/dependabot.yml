# Dependabot version updates. Settings rationale and review traps: dependabot.md
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: friday
      time: "18:00"
      timezone: Europe/Vienna
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: typescript
        versions: ["7.0.x"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: friday
      time: "18:00"
      timezone: Europe/Vienna
    cooldown:
      default-days: 3
