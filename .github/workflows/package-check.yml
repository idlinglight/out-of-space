# Unsigned packaged-build check. What, why and how to run: package-check.md
name: Package check

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  package-check:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 24
      - run: npm ci
      - run: npm run test:package
