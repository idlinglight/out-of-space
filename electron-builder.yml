appId: at.idling.out-of-space
productName: Out Of Space
directories:
  buildResources: build
  output: dist
# Allowlist: electron-vite's output plus the licence. Any include pattern stops
# electron-builder from packing the whole repo (it prepends `**/*` when `files`
# holds only `!` exclusions); package.json and production node_modules are
# always added. Typecheck leaves *.tsbuildinfo in out/, hence the subdirectories.
files:
  - "out/{main,preload,renderer}/**/*"
  - LICENSE
asar: true
mac:
  icon: icon.icon
  # Local builds never sign; the release workflow overrides this on the CLI
  # (see .github/workflows/release.yml and docs/RELEASING.md)
  identity: null
  target:
    - dmg
    - zip
  artifactName: "${productName}-${version}-${arch}.${ext}"
